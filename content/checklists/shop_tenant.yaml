# 가게 세입자(상가 임차인) 체크리스트
# 모든 문장은 legal_basis 조문의 현행 원문(국가법령정보, 2026.9 수집)과 대조했다.

resident_type: shop_tenant
items:
  - id: shop.keep_business_proof
    impl_types: [union, public]
    stages: [CPC_APPROVAL, ZONE_DESIGNATION, UNION_APPROVAL, DEVELOPER_DESIGNATION, RESIDENT_COUNCIL, PROJECT_APPROVAL, SALE_APPLICATION, MGMT_DISPOSAL]
    kind: todo
    is_money: true
    title: 사업자등록증, 임대차계약서, 매출 자료를 챙겨 두세요
    plain_body: >
      영업손실 보상은 기준일 전부터 적법한 장소에서 시설을 갖추고 계속 영업해 왔는지, 그동안 영업이익이 얼마였는지로 정해져요.
      사업자등록증, 영업 허가나 신고증, 임대차계약서, 부가세 신고 자료 같은 증빙을 꼭 보관하세요.
    legal_basis: 토지보상법 시행규칙 제45조, 제47조
    law_ref: 토지보상법 시행규칙 제45조
    sort_order: 10

  - id: shop.business_loss
    impl_types: [union, public]
    stages: [ZONE_DESIGNATION, UNION_APPROVAL, DEVELOPER_DESIGNATION, RESIDENT_COUNCIL, PROJECT_APPROVAL, SALE_APPLICATION, MGMT_DISPOSAL, RELOCATION]
    kind: benefit
    is_money: true
    title: 영업손실(휴업) 보상을 받을 수 있어요
    plain_body: >
      가게를 옮겨야 하면 문을 닫는 기간의 영업이익, 그 기간의 고정비, 시설과 상품을 옮기는 비용,
      이전 광고비 같은 부대비용을 보상받을 수 있어요. 휴업 기간은 원칙적으로 4개월 이내로 계산해요.
      조합원이 아니어도 받을 수 있는 권리예요.
    conditions: >
      정비사업에서는 정비계획 공람공고일이 보상 대상을 정하는 기준 시점이에요. 그 전부터 적법한 장소에서 계속 영업했어야 하고,
      허가나 신고가 필요한 업종은 그 전에 갖췄어야 해요. 무허가건축물에서 영업하는 임차인은 기준일 1년 전부터 사업자등록이 있어야 하고
      보상액 상한(1천만원, 이전비 제외)이 있어요.
    legal_basis: 토지보상법 시행규칙 제45조, 제47조, 도시정비법 시행령 제54조제2항, 제3항
    law_ref: 토지보상법 시행규칙 제47조
    sort_order: 20

  - id: shop.movable_cost
    impl_types: [union, public]
    stages: [MGMT_DISPOSAL, RELOCATION]
    kind: benefit
    is_money: true
    title: 가게 물건을 옮기는 비용을 받을 수 있어요
    plain_body: >
      가게의 상품, 집기 같은 물건(동산)을 옮기는 데 드는 비용과 옮기면서 생기는 손상분을 보상받을 수 있어요.
    legal_basis: 토지보상법 시행규칙 제55조제1항, 제47조제1항
    law_ref: 토지보상법 시행규칙 제55조
    sort_order: 30

  - id: shop.deposit_claim
    impl_types: [union, public]
    stages: [MGMT_DISPOSAL, RELOCATION]
    kind: benefit
    is_money: true
    title: 보증금을 사업시행자에게도 돌려달라고 할 수 있어요
    plain_body: >
      정비사업 때문에 가게를 계속 쓸 수 없게 되면 계약을 해지할 수 있고,
      보증금 반환 청구는 건물주뿐 아니라 사업시행자(조합 또는 LH)에게도 할 수 있어요.
    legal_basis: 도시정비법 제70조제1항, 제2항
    law_ref: 도시정비법 제70조
    sort_order: 40

  - id: shop.lease_term_not_protected
    impl_types: [union, public]
    stages: [SALE_APPLICATION, MGMT_DISPOSAL, RELOCATION]
    kind: caution
    is_money: false
    title: 관리처분 인가 뒤에는 상가 계약기간 보장이 적용되지 않아요
    plain_body: >
      관리처분계획이 인가되면 상가건물 임대차보호법의 최소 계약기간 규정이 적용되지 않아요.
      계약기간이 남아 있어도 가게를 비워야 할 수 있으니, 영업손실 보상과 보증금 반환 일정을 미리 확인하세요.
    legal_basis: 도시정비법 제70조제5항
    law_ref: 도시정비법 제70조
    sort_order: 45

  - id: shop.use_suspension
    impl_types: [union, public]
    stages: [MGMT_DISPOSAL, RELOCATION]
    kind: caution
    is_money: false
    title: 관리처분 인가 뒤에는 가게를 비워야 해요
    plain_body: >
      관리처분계획 인가 고시가 나면 상가 세입자도 원칙적으로 지금 가게를 계속 쓸 수 없어요.
      손실보상이 끝나지 않았다면 그때까지는 예외가 인정되니 보상 안내를 먼저 확인하세요.
    legal_basis: 도시정비법 제81조제1항
    law_ref: 도시정비법 제81조
    sort_order: 50

  - id: shop.public_opinion
    impl_types: [public]
    stages: [DEVELOPER_DESIGNATION, RESIDENT_COUNCIL, PROJECT_APPROVAL, SALE_APPLICATION, MGMT_DISPOSAL, RELOCATION]
    kind: todo
    is_money: false
    title: 상가 세입자도 이주와 보상 규정에 의견을 낼 수 있어요
    plain_body: >
      공공기관이 사업시행자인 구역에서는 상가 세입자도 이주, 보상에 관한 시행규정에 의견을 낼 수 있고,
      사업시행자는 이를 반영하도록 노력해야 해요.
    legal_basis: 도시정비법 제47조제5항
    law_ref: 도시정비법 제47조
    sort_order: 70
