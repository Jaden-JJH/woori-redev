# 용어 사전: 답변과 체크리스트에 나오는 어려운 말을 쉬운 말로 풀어준다.
terms:
  - term: 추정분담금
    aliases: [추정 분담금, 분담금 추정액]
    plain: 새 아파트를 받으려면 더 내야 할 것으로 미리 계산해 본 돈이에요. 사업 초기에 계산한 값이라 나중에 달라질 수 있어요.
    legal_ref: 도시정비법 제9조제1항제2호의2
  - term: 분담금
    aliases: [조합원 분담금]
    plain: 새 아파트 분양가에서 내 종전 재산의 권리가액을 뺀 돈이에요. 분양가가 더 크면 내고, 권리가액이 더 크면 돌려받아요.
    example: 분양가 6억 원, 권리가액 4억 원이면 분담금은 2억 원이에요.
    legal_ref: 도시정비법 제74조제1항
  - term: 권리가액
    aliases: [권리 가액]
    plain: 내 종전 집과 땅의 감정평가액에 비례율을 곱한 값이에요. 새 아파트를 받을 때 내 몫으로 인정되는 금액이에요.
    example: 감정평가액 3억 원, 비례율 100%면 권리가액은 3억 원이에요.
    legal_ref: 도시정비법 시행규칙 별표 6
  - term: 비례율
    aliases: [개발이익 비례율]
    plain: 사업이 끝난 뒤 전체 재산 가치에서 사업비를 뺀 금액을, 사업 전 전체 재산 가치로 나눈 비율이에요. 100%보다 높으면 사업성이 좋다는 뜻이에요.
    example: 비례율 = (사업완료 후의 대지 및 건축물의 총 수입 - 총사업비) / 종전의 토지 및 건축물의 총 가액
    legal_ref: 도시정비법 시행규칙 별표 6
  - term: 종전자산 평가
    aliases: [종전자산, 종전 자산, 종전자산평가]
    plain: 사업을 시작하기 전 내 집과 땅이 얼마인지 감정평가하는 거예요. 권리가액 계산의 출발점이에요.
    legal_ref: 도시정비법 제74조
  - term: 관리처분계획
    aliases: [관리처분, 관리처분 계획]
    plain: 누가 어떤 새 집을 받고 얼마를 더 내거나 돌려받는지 정한 최종 배분 계획이에요.
    legal_ref: 도시정비법 제74조
  - term: 사업시행계획인가
    aliases: [사업시행인가, 사업시행계획 인가]
    plain: 건물 배치, 세대 수, 세입자 대책 같은 사업의 구체 계획을 시가 허락하는 거예요.
    legal_ref: 도시정비법 제50조
  - term: 분양신청
    aliases: [분양 신청]
    plain: 새 아파트를 받겠다고 정해진 기간 안에 신청하는 거예요. 놓치면 현금청산 대상이 될 수 있어요.
    legal_ref: 도시정비법 제72조
  - term: 현금청산
    aliases: [현금 청산, 현금청산자]
    plain: 새 아파트 대신 내 재산을 돈으로 보상받고 사업에서 빠지는 거예요.
    legal_ref: 도시정비법 제73조
  - term: 주거이전비
    aliases: [주거 이전비, 이주정착비]
    plain: 정비사업 때문에 이사를 나가야 하는 사람에게 주는 보상이에요. 세입자는 4개월분, 실제로 살던 소유자는 2개월분이 기준이에요.
    legal_ref: 토지보상법 시행규칙 제54조
  - term: 이사비
    aliases: [동산 이전비, 이전비]
    plain: 이삿짐을 옮기는 데 드는 비용을 보상하는 돈이에요.
    legal_ref: 토지보상법 시행규칙 제55조
  - term: 영업손실 보상
    aliases: [영업보상, 휴업보상, 영업손실]
    plain: 가게를 옮기거나 닫아야 할 때 그동안 벌지 못한 영업이익과 이전 비용을 보상하는 돈이에요.
    legal_ref: 토지보상법 시행규칙 제45조, 제47조
  - term: 이주비
    aliases: [이주비 대출]
    plain: 이주할 때 새로 살 곳을 구하도록 소유자에게 빌려주는 돈이에요. 보상금이 아니라 대출이라 나중에 갚아야 해요.
  - term: 이전고시
    aliases: [이전 고시]
    plain: 공사가 끝난 뒤 새 집과 땅의 소유권을 분양받은 사람에게 넘긴다고 시가 알리는 거예요.
    legal_ref: 도시정비법 제86조
  - term: 청산금
    aliases: []
    plain: 종전 재산 가격과 새로 받은 집 가격의 차이만큼 이전고시 뒤에 주고받는 돈이에요.
    legal_ref: 도시정비법 제89조
  - term: 토지등소유자
    aliases: [토지 등 소유자]
    plain: 재개발 구역 안의 땅이나 건물을 가진 사람이에요. 동의서, 분양신청 같은 권리를 가져요.
    legal_ref: 도시정비법 제2조
  - term: 추진위원회
    aliases: [조합설립추진위원회, 추진위]
    plain: 조합을 만들기 전에 준비를 맡는 주민 모임이에요. 토지등소유자 과반수 동의로 만들어요.
    legal_ref: 도시정비법 제31조
  - term: 주민대표회의
    aliases: [주민 대표회의]
    plain: LH 같은 공공기관이 사업을 맡을 때 주민을 대표해 협의하는 모임이에요.
    legal_ref: 도시정비법 제47조
  - term: 사업시행자
    aliases: [시행자]
    plain: 정비사업을 실제로 진행하고 책임지는 쪽이에요. 조합이거나, LH 같은 공공기관이에요.
    legal_ref: 도시정비법 제25조, 제26조
  - term: 공람
    aliases: [공람공고, 주민공람]
    plain: 계획을 정하기 전에 주민이 보고 의견을 낼 수 있도록 일정 기간 공개하는 거예요.
    legal_ref: 도시정비법 제15조
  - term: 정비구역
    aliases: [정비구역 지정]
    plain: 재개발을 하기로 시가 경계를 정해 고시한 지역이에요.
    legal_ref: 도시정비법 제8조
  - term: 일반분양
    aliases: []
    plain: 조합원이나 원래 소유자에게 배정하고 남은 새 아파트를 일반 청약자에게 파는 거예요.
  - term: 보류지
    aliases: [보류시설]
    plain: 나중에 생길 착오나 소송에 대비해 분양하지 않고 남겨 두는 집이나 땅이에요.
