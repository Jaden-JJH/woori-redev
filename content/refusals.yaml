# 답하지 않는 질문(네거티브 리스트)과 대신 안내할 곳
# patterns: 정책 게이트의 규칙 사전. 질의 분석 모델의 판정과 OR 조건으로 쓴다.

contacts:
  seongnam_redev:
    name: 성남시청 재개발과
    tel: 031-729-2114
    note: 성남시청 대표번호로 걸어 재개발과로 연결해 달라고 하세요.
    url: https://www.seongnam.go.kr
  lh:
    name: 한국토지주택공사(LH) 고객센터
    tel: 1600-1004
    note: 수진1구역처럼 LH가 사업시행자인 구역의 보상, 이주 문의
    url: https://www.lh.or.kr
  legal_aid:
    name: 대한법률구조공단
    tel: "132"
    note: 법률 상담이 필요할 때 무료 상담을 받을 수 있어요.
    url: https://www.klac.or.kr
  union_office:
    name: 우리 구역 추진위원회 또는 조합 사무실
    tel: null
    note: 구역별 공지와 개별 분담금 산정은 추진위원회나 조합이 안내해요.
    url: null

categories:
  price_forecast:
    message: 재개발 뒤 집값이나 수익은 예측하지 않아요.
    reason: 이 서비스는 공식 문서에 적힌 절차와 권리만 안내해요. 시세 전망은 근거 문서가 없는 추측이 될 수 있어요.
    contacts: [seongnam_redev]
    patterns:
      - "(집|아파트|땅|부동산)\\s*(값|가격|시세)"
      - "(집|아파트|땅|부동산|값|가격).{0,6}(오를까|떨어질까|오르나요|떨어지나요|얼마나\\s*오를)"
      - "시세\\s*(전망|예상|오를|떨어질)"
      - "프리미엄|피\\s*얼마|웃돈"
      - "투자(해도|할까|가치|수익)"
      - "수익률|시세차익|몇\\s*배"
      - "사도\\s*될까|팔아야\\s*할까|팔까요|살까요"
  personal_levy_calc:
    message: 우리 집 분담금이 정확히 얼마인지는 계산해 드릴 수 없어요.
    reason: 개별 분담금은 종전 재산 감정평가와 비례율로 사업시행자가 정해요. 추정분담금과 확정 분담금의 차이 같은 절차는 물어보실 수 있어요.
    contacts: [union_office, seongnam_redev]
    patterns:
      - "(우리|내|제)\\s*(집|건물|땅)?\\s*분담금[은이]?\\s*(얼마|계산)"
      - "분담금\\s*(좀\\s*)?계산해"
      - "감정평가(액|가)?\\s*(얼마|예상)"
      - "권리가액\\s*(얼마|계산)"
  financial_product:
    message: 특정 대출이나 금융상품은 추천하지 않아요.
    reason: 금융상품 선택은 개인 상황에 따라 달라서 공식 문서로 답할 수 없어요. 이주비가 무엇이고 언제 나오는지는 물어보실 수 있어요.
    contacts: [union_office]
    patterns:
      - "(어느|어떤|무슨)\\s*(은행|대출|상품|보험)"
      - "대출\\s*(추천|어디)"
      - "(은행|대출|상품)\\s*(추천|비교|좋)"
      - "금리\\s*(낮은|싼|어디)"
  legal_judgment:
    message: 법적인 판단은 해 드릴 수 없어요.
    reason: 소송, 계약 효력, 결의의 적법성 같은 판단은 개별 사실관계에 따라 달라서 전문가 상담이 필요해요.
    contacts: [legal_aid, seongnam_redev]
    patterns:
      - "소송|고소|고발|재판"
      - "(이길|승소|패소)"
      - "(무효|위법|불법)(인가요|이에요|일까|인지)?"
      - "변호사"
      - "(배상|손해배상)\\s*받을\\s*수"
  evaluation:
    message: 조합, 사업시행자, 특정 사람에 대한 평가는 하지 않아요.
    reason: 공식 문서에 적힌 사실과 절차만 안내해요.
    contacts: [seongnam_redev]
    patterns:
      - "(조합장|추진위원장|시공사|건설사).*(믿을|괜찮|나쁜|좋은|비리)"
      - "(비리|횡령|사기)"
  prompt_injection:
    message: 이 요청은 처리할 수 없어요.
    reason: 이 서비스는 정비사업 절차와 권리에 대한 질문에만 답해요.
    contacts: [seongnam_redev]
    patterns:
      - "(이전|위|앞)의?\\s*(지시|명령|규칙|프롬프트).*(무시|잊)"
      - "(시스템|system)\\s*(프롬프트|prompt)"
      - "ignore\\s+(all\\s+)?(previous|prior)"
      - "너는\\s*이제|역할을\\s*바꿔|탈옥|jailbreak"
  off_topic:
    message: 정비사업과 관련된 질문에만 답할 수 있어요.
    reason: 이 서비스는 성남 원도심 정비사업의 절차, 권리, 기한을 안내해요.
    contacts: [seongnam_redev]
    patterns: []
  no_evidence:
    message: 우리 구역의 공식 자료에서 답을 찾지 못했어요.
    reason: 근거 문서가 없으면 추측해서 답하지 않아요. 아래 창구에 확인해 보세요.
    contacts: [union_office, seongnam_redev]
    patterns: []

suggestions:
  owner:
    - 추정분담금이 확정 금액인가요?
    - 분양신청을 안 하면 어떻게 되나요?
    - 관리처분계획은 언제 확인할 수 있나요?
    - 조합설립 동의는 몇 명이 해야 하나요?
  tenant:
    - 세입자도 이사 비용을 받을 수 있나요?
    - 주거이전비는 누가 받을 수 있나요?
    - 보증금은 누구에게 돌려받나요?
    - 언제까지 이사를 나가야 하나요?
  shop_tenant:
    - 가게 세입자도 보상을 받나요?
    - 영업손실 보상은 어떻게 계산하나요?
    - 보증금은 누구에게 돌려받나요?
    - 보상 받으려면 무엇을 챙겨야 하나요?
