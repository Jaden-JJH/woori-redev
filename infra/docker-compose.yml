name: woori-redev

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: woori
      POSTGRES_PASSWORD: woori
      POSTGRES_DB: woori
    ports:
      - "54329:5432"
    volumes:
      - woori-db:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woori -d woori"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  woori-db:
