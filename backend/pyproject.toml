[project]
name = "woori"
version = "1.0.0"
description = "우리동네 재개발 비서 - 성남 원도심 정비사업 근거 인용 안내 서비스 백엔드"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "kiwipiepy>=0.20",
    "pyyaml>=6.0",
    "anthropic>=0.60",
    "google-genai>=1.0",
    "pdfplumber>=0.11",
    "olefile>=0.47",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
woori = "woori.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woori"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# B008: FastAPI 의 File(), Form() 기본값 관용구. RUF001~003: 한국어 문장부호.
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
